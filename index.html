<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D</title>
  <!-- Using the standard browser-ready library -->
  <script src="https://unpkg.com/globe.gl"></script>
  
  <style>
    
#box-desc b {
    color: #b08d57; /* This makes your bold headings match the theme color */
    display: inline-block;
    margin-top: 10px;
}
    body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; }
    
    /* THE CHARACTER STAND-UP FIGURE */
    .character-standee {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        pointer-events: auto !important;
        /* Move the anchor to the feet of the image */
        transform: translate(-50%, -100%);
        transition: transform 0.2s;
    }
    
    .character-standee:hover {
        transform: translate(-50%, -105%) scale(1.4);
    }

    .character-standee img {
        width: 60px; /* Adjust size here */
        height: auto;
        filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.7));
    }

    .character-standee .label {
        background: rgba(0, 0, 0, 0.8);
        color: #ffcc00;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: bold;
        margin-top: -5px;
        border: 1px solid #ffcc00;
        white-space: nowrap;
    }

    /* THE POPUP DIALOGUE BOX */
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 550px; background: white; border-radius: 20px;
      display: none; z-index: 10000; padding: 35px;
      box-shadow: 0 0 100px rgba(0,0,0,0.9); color: #222;
      border-top: 8px solid #b08d57;
    }
    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 12px 24px;
      border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  <div id="info-box">
    <button class="back-btn" onclick="closeBox()">✕ BACK TO NAVIGATION</button>
    <div id="box-year" style="color:#b08d57; font-weight:bold; margin-bottom:10px;"></div>
    <h2 id="box-title" style="margin:0; font-size: 2rem;"></h2>
    <hr style="opacity:0.2; margin:20px 0;">
    <p id="box-desc" style="line-height:1.8; color:#444; font-size:1.1rem;"></p>
  </div>

  <script>
    // --- 1. DATASET ---
    // The path './images/...' works best for GitHub Pages
    const historyData = [
      { 
  name: "Lord Rama", 
  year: "Between 400 BCE and 500 BCE", 
  lat: 26.8, lng: 82.2, 
  img: "./images/rama.png", 
  desc: `
    <b style="color:black; font-size:1.4rem; display:block; margin-bottom:10px;">Lord Rama and the Ramayana: The Story of Dharma, Duty, and Ideal Leadership</b>
    
    Unlike figures such as Alexander or Hitler, Lord Rama is primarily a revered religious and literary figure rather than a historical ruler documented through modern historical records. In Hindu tradition, Rama is worshipped as the seventh avatar (incarnation) of Lord Vishnu and is the central hero of the Ramayana, one of India's greatest epics.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">The Birth of Rama</b>
    The story begins in the kingdom of Ayodhya, ruled by King Dasharatha. Although prosperous and respected, Dasharatha had no children and worried about the future of his kingdom. After performing a sacred ritual, his queens gave birth to four sons:
    <ul style="margin-top:10px;">
      <li>Rama</li>
      <li>Bharata</li>
      <li>Lakshmana</li>
      <li>Shatrughna</li>
    </ul>
    Rama, the eldest son, was born to Queen Kaushalya and was destined to become the heir to the throne. From childhood, he displayed wisdom, compassion, courage, humility, and devotion to duty.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Education and Marriage to Sita</b>
    As a young prince, Rama was trained in warfare, governance, and spiritual wisdom under great sages. During a journey with the sage Vishvamitra, Rama protected sacred hermitages from evil forces and demonstrated extraordinary strength and virtue.<br><br>
    In the kingdom of Mithila lived Princess Sita, renowned for her beauty, purity, and character. Her father, King Janaka, declared that she would marry the man who could string the mighty bow of Lord Shiva.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Many kings failed.</b>
    Rama not only lifted the bow but broke it while stringing it. Sita chose him as her husband, and their marriage became an enduring symbol of devotion and righteousness.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">The Exile from Ayodhya</b>
    As King Dasharatha prepared to crown Rama as king, a dramatic turn changed everything. Dasharatha's wife Kaikeyi invoked two promises the king had previously made to her. She demanded:
    <ul style="margin-top:10px;">
      <li>Her son Bharata be made king.</li>
      <li>Rama be exiled to the forest for fourteen years.</li>
    </ul>
    Though unjust, Rama accepted the decision without anger because he believed obeying his father's word was his sacred duty (dharma). Sita insisted on accompanying him, and his devoted brother Lakshmana joined them as well. This episode remains one of the most famous examples of sacrifice and duty in world literature.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Life in the Forest</b>
    For years, Rama, Sita, and Lakshmana lived in forests across India, meeting sages, helping communities, and confronting dangerous beings. During this period, they encountered Shurpanakha, sister of the powerful king Ravana. Humiliated after her advances toward Rama were rejected, she sought revenge and persuaded Ravana to abduct Sita.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Ravana and the Abduction of Sita</b>
    Ravana, the powerful ruler of Lanka, was a learned and mighty king but was consumed by pride and desire. Using deception, he lured Rama and Lakshmana away from their hut and kidnapped Sita, carrying her to Lanka in his flying chariot. Sita refused Ravana's attempts to make her his queen and remained steadfastly devoted to Rama despite months of captivity.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Hanuman and the Search for Sita</b>
    While searching for Sita, Rama formed an alliance with Sugriva, king of the Vanaras (often described as a monkey kingdom). Among Sugriva's followers was Hanuman, one of the most beloved figures in Hindu tradition. Hanuman became completely devoted to Rama and dedicated himself to finding Sita. He made an extraordinary leap across the ocean to Lanka, located Sita, delivered Rama's message, and returned with information that would enable the rescue mission.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Building the Bridge to Lanka</b>
    To reach Lanka, Rama's army constructed a legendary bridge across the sea, often referred to as Rama Setu in Hindu tradition. The crossing set the stage for one of the epic's greatest events: the war between Rama and Ravana.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">The Great War</b>
    A massive battle followed between the forces of Rama and Ravana. Many heroes fought on both sides. Hanuman's courage, Lakshmana's loyalty, and the determination of Rama's allies proved decisive. After fierce combat, Rama confronted Ravana directly and defeated him, ending his reign and rescuing Sita. The victory symbolized the triumph of righteousness over evil. This victory is celebrated annually during Dussehra.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Return to Ayodhya</b>
    After completing the fourteen-year exile, Rama, Sita, and Lakshmana returned to Ayodhya. The people welcomed them with lamps and celebrations, marking Rama's return and coronation as king. This event is commemorated in the festival of Diwali, one of the most widely celebrated festivals in India.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Rama Rajya: The Ideal Kingdom</b>
    Rama's reign became known as Rama Rajya, representing an ideal society characterized by:
    <ul style="margin-top:10px;">
      <li>Justice</li>
      <li>Prosperity</li>
      <li>Peace</li>
      <li>Ethical governance</li>
      <li>Respect for duty and law</li>
    </ul>
    For centuries, Rama Rajya has remained a symbol of ideal leadership and good governance in Indian thought.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Sita's Final Departure</b>
    The later chapters of the Ramayana describe public doubts about Sita's purity after her captivity in Lanka. To preserve public confidence in the kingdom, Rama reluctantly separated from Sita. Living in a hermitage, Sita gave birth to twin sons, Lava and Kusha. Eventually, she called upon Mother Earth, from whom she was believed to have originated, and returned to the earth.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Legacy of Rama</b>
    Rama is revered as the ideal son, husband, brother, and king—the embodiment of dharma (righteous duty). The Ramayana, traditionally attributed to the sage Valmiki, contains approximately 24,000 verses and remains one of the most influential works of literature and spirituality in Asia. It has inspired countless retellings, performances, artworks, and religious traditions across India and Southeast Asia.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">In Summary</b>
    The Ramayana is not merely a story of a prince rescuing his wife. It is a profound exploration of duty, sacrifice, loyalty, courage, leadership, and morality. Lord Rama's journey continues to serve as a model of righteous conduct for millions of people around the world.
  `
},
      { 
  name: "Alexander the Great", 
  year: "334 - 323 BCE", 
  lat: 37.9, lng: 23.7, 
  img: "./images/alexander.png", 
  desc: `
    <b style="color:black; font-size:1.4rem; display:block; margin-bottom:10px;">Alexander the Great: The Rise, Conquests, and Legacy of a World Conqueror</b>
    
    Alexander the Great (356 BCE to 323 BCE) was one of history's most famous military commanders and rulers. By the age of 30, he had built an empire stretching from Greece and Egypt to parts of modern-day India, creating one of the largest empires of the ancient world.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Early Life and Education (356 BCE to 336 BCE)</b>
    Alexander was born in 356 BCE in Pella, the capital of Macedonia. He was the son of King Philip II of Macedonia and Queen Olympias. From an early age, he showed intelligence, ambition, and courage.<br><br>
    When he was about 13 years old, his father appointed the Greek philosopher Aristotle as his tutor. Aristotle taught him philosophy, science, medicine, literature, and politics. This education helped shape Alexander into both a warrior and a statesman.<br><br>
    As a teenager, Alexander also gained military experience. At age 16, he governed Macedonia while his father was away on campaign, and at 18 he played an important role in the Macedonian victory at the Battle of Chaeronea.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Becoming King (336 BCE)</b>
    In 336 BCE, King Philip II was assassinated. At only 20 years old, Alexander became king of Macedonia. Many rivals hoped to challenge his rule, but Alexander acted quickly to eliminate threats and secure his position. Several Greek city-states rebelled, believing the young king would be weak; Alexander crushed these uprisings and demonstrated that he possessed the same military strength as his father.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">The Persian Campaign Begins (334 BCE)</b>
    Alexander's greatest ambition was to invade the Persian Empire, the most powerful empire of the time. In 334 BCE, he crossed into Asia Minor with an army of Macedonian and Greek soldiers. His first major victory came at the Battle of the Granicus River, marking the beginning of a campaign that would change world history.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Defeating Darius III (333 BCE)</b>
    In 333 BCE, Alexander faced the Persian king Darius III at the Battle of Issus. Although Darius commanded a much larger army, Alexander's leadership and battlefield tactics secured a decisive victory. This victory established Alexander as the dominant military force in the region.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">The Siege of Tyre and Conquest of Egypt (332 BCE)</b>
    Alexander then marched south along the Mediterranean coast. One of his most famous military achievements was the Siege of Tyre, a heavily fortified island city. He then continued into Egypt, where he was welcomed as a liberator and founded the city of Alexandria, which became a global center of learning.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Conquering the Persian Empire (331 BCE to 330 BCE)</b>
    Alexander's most important victory came at the Battle of Gaugamela in 331 BCE. After this, he captured major Persian cities including Babylon, Susa, and Persepolis. The Persian Empire effectively collapsed, and Alexander declared himself King of Asia.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Expansion into Central Asia and India (330 BCE to 326 BCE)</b>
    Alexander continued eastward through modern Afghanistan and Central Asia. In 326 BCE, he fought King Porus at the Battle of the Hydaspes River in India. Reluctantly, after years of campaigning, he agreed to turn back when his exhausted soldiers refused to march farther east.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Building a New World</b>
    Alexander encouraged interaction between Greek and local cultures. His campaigns spread Greek language, art, and philosophy across a huge area. This blending of cultures became known as the Hellenistic Age, which influenced civilization for centuries.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Death in Babylon (323 BCE)</b>
    In 323 BCE, Alexander returned to Babylon. He suddenly fell ill and died at the age of 32. Because he left no clear heir, his generals fought for control, and the empire fragmented into several kingdoms.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Historical Legacy</b>
    Alexander never lost a major battle and is regarded as one of the greatest military commanders in history. Unlike many conquerors, his lasting impact came from the widespread exchange of ideas, trade, and technology that followed his campaigns.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">In Summary</b>
    Alexander's story is one of extraordinary ambition. Born a prince in a small kingdom, he conquered the largest empire of his age before 30, and left a legacy that shaped the political and cultural landscape of three continents long after his death.
  `
},
      { 
  name: "Adolf Hitler", 
  year: "1933 - 1945", 
  lat: 52.5, lng: 13.4, 
  img: "./images/hitler.png", 
  desc: `
    <b style="color:black; font-size:1.4rem; display:block; margin-bottom:10px;">Adolf Hitler: The Rise, Rule, and Fall of Nazi Germany</b>
    
    Adolf Hitler (1889–1945) was the leader of Nazi Germany and one of the most consequential and destructive figures in modern history. His leadership led to World War II and the Holocaust, resulting in the deaths of tens of millions of people.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Early Life (1889–1913)</b>
    Hitler was born in Braunau am Inn, Austria-Hungary. As a young man, he aspired to be an artist but was twice rejected by the Vienna Academy of Fine Arts. During his years in Vienna, he experienced poverty and developed many of the extremist political and racial ideas that later shaped his ideology.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">World War I and Political Awakening (1914–1919)</b>
    Hitler volunteered for the German Army in 1914. He served as a messenger on the Western Front and was temporarily blinded in a mustard gas attack. Germany's defeat in 1918 deeply affected him; he blamed the nation's problems on political opponents and Jewish people, adopting increasingly radical views.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Rise of the Nazi Party (1919–1933)</b>
    Hitler joined the German Workers' Party in 1919, quickly becoming its leader. After a failed coup attempt in 1923 (the Beer Hall Putsch), he was imprisoned, where he dictated <i>Mein Kampf</i>. Following his release, he leveraged the economic despair of the Great Depression to gain support. In January 1933, he was appointed Chancellor of Germany and rapidly consolidated power.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Establishing Dictatorship (1933–1939)</b>
    Hitler dismantled democratic institutions following the Reichstag Fire, passing the Enabling Act to govern without parliament. By 1934, he assumed the title <i>Führer</i> ("Leader"). The Nazi regime controlled all media, suppressed opposition, and implemented racial laws targeting specific groups through state-sponsored propaganda.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Road to War (1938–1939)</b>
    Hitler sought to expand German territory, annexing Austria and parts of Czechoslovakia. On September 1, 1939, Germany invaded Poland, leading Britain and France to declare war, marking the beginning of World War II.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">World War II and the Holocaust (1939–1945)</b>
    While Germany initially conquered much of Europe, the 1941 invasion of the Soviet Union turned the tide of the war. Under Hitler’s regime, the Holocaust was carried out—the systematic murder of approximately six million Jews, along with millions of others, including:
    <ul style="margin-top:10px;">
      <li>Roma (Gypsies)</li>
      <li>Disabled individuals</li>
      <li>Political opponents</li>
      <li>Soviet prisoners of war</li>
    </ul>
    The Holocaust remains one of history's greatest atrocities.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Final Days and Death (1945)</b>
    By April 1945, Soviet forces surrounded Berlin. Hitler retreated to a bunker beneath the city. On April 30, 1945, he died by suicide as Germany faced total defeat. Germany surrendered shortly afterward, ending the war in Europe.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">Historical Legacy</b>
    Hitler is regarded as the principal architect of the war in Europe and the Holocaust. His actions reshaped global politics and serve as a permanent historical warning about the catastrophic consequences of extremism, concentrated power, and state-sponsored intolerance.<br><br>
    
    <b style="color:black; font-size:1.1rem; display:block; margin-bottom:5px;">In Summary</b>
    Adolf Hitler’s story is a critical study of how political instability and extremist ideology can lead to global tragedy. His legacy is defined by aggressive warfare, genocide, and the eventual total destruction of the regime he created.
  `
}
   ];

    // --- 2. INITIALIZE GLOBE ---
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      
      // USE HTML ELEMENTS (MUCH MORE STABLE)
      .htmlElementsData(historyData)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'character-standee';
        el.innerHTML = `
          <img src="${d.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3752/3752311.png'">
          <div class="label">${d.name}</div>
        `;
        
        // Clicks will now work 100%
        el.onclick = () => showDialogue(d);
        return el;
      });

    // --- 3. UI FUNCTIONS ---
    function showDialogue(data) {
      document.getElementById('box-title').innerText = data.name;
      document.getElementById('box-year').innerText = "ERA: " + data.year;
      document.getElementById('box-desc').innerHTML = data.desc;
      document.getElementById('box-overlay').style.display = 'block';
      document.getElementById('info-box').style.display = 'block';
      world.controls().autoRotate = false;
    }

    function closeBox() {
      document.getElementById('box-overlay').style.display = 'none';
      document.getElementById('info-box').style.display = 'none';
      world.controls().autoRotate = true;
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
