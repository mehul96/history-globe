<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D | Fixed Pins</title>
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background: #000; font-family: 'Georgia', serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; }
    
    /* THE POPUP DIALOGUE BOX */
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80%; max-width: 600px; max-height: 80vh; overflow-y: auto;
      background: white; color: #1a1a1a; padding: 40px; border-radius: 12px;
      display: none; z-index: 10000; box-shadow: 0 0 100px rgba(0,0,0,0.9);
    }
    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 12px 25px;
      border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
    }
    h2 { margin: 0; font-size: 2.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
    #box-year { color: #b08d57; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  <div id="info-box">
    <button class="back-btn" onclick="closeBox()">✕ BACK TO EARTH</button>
    <div id="box-year"></div>
    <h2 id="box-title"></h2>
    <p id="box-desc" style="line-height: 1.8; font-size: 1.2rem;"></p>
  </div>

  <script>
    // --- 1. DATASET ---
    // IMPORTANT: Make sure your image paths match your GitHub folder exactly!
    const historyData = [
      { 
        name: "Lord Rama", year: "Date Debated", lat: 26.8, lng: 82.2, 
        img: "images/rama.png", 
        desc: "Lord Rama, the seventh avatar of Lord Vishnu, whose life is chronicled in the Ramayana. He is a symbol of Dharma and the perfect man."
      },
      { 
        name: "Alexander the Great", year: "334 BCE", lat: 37.9, lng: 23.7, 
        img: "images/alexander.png", 
        desc: "King of Macedon who conquered the Persian Empire and reached the edges of India."
      },
      { 
        name: "Adolf Hitler", year: "1939 (WWII)", lat: 52.5, lng: 13.4, 
        img: "images/hitler.png", 
        desc: "The leader of Nazi Germany who initiated World War II in Europe."
      }
    ];

    // --- 2. INITIALIZE GLOBE ---
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      
      // THIS IS THE FIX: Using 3D Sprites instead of HTML stickers
      .customLayerData(historyData)
      .customLayerElement(d => {
        // Create an image loader
        const imgTexture = new THREE.TextureLoader().load(d.img);
        const material = new THREE.SpriteMaterial({ map: imgTexture, transparent: true });
        const sprite = new THREE.Sprite(material);
        
        // Scale the character (size on globe)
        sprite.scale.set(12, 12, 1); 
        return sprite;
      })
      .onCustomLayerClick(d => showDialogue(d));

    // --- 3. UI FUNCTIONS ---
    function showDialogue(data) {
      document.getElementById('box-title').innerText = data.name;
      document.getElementById('box-year').innerText = "Era: " + data.year;
      document.getElementById('box-desc').innerText = data.desc;
      
      document.getElementById('box-overlay').style.display = 'block';
      document.getElementById('info-box').style.display = 'block';
      world.controls().autoRotate = false;
    }

    function closeBox() {
      document.getElementById('box-overlay').style.display = 'none';
      document.getElementById('info-box').style.display = 'none';
      world.controls().autoRotate = true;
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
