<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D | Master Edition</title>
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background: #000; font-family: 'Georgia', serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; }
    
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 550px; background: white; border-radius: 20px;
      display: none; z-index: 10000; padding: 35px;
      box-shadow: 0 0 100px rgba(0,0,0,0.9); color: #222;
      border-top: 8px solid #b08d57;
    }
    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 12px 24px;
      border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  <div id="info-box">
    <button class="back-btn" onclick="closeBox()">✕ BACK TO EARTH</button>
    <div id="box-year" style="color: #b08d57; font-weight: bold; margin-bottom: 10px;"></div>
    <h2 id="box-title" style="margin:0;"></h2>
    <hr style="opacity: 0.2; margin: 20px 0;">
    <p id="box-desc" style="line-height: 1.8; font-size: 1.1rem; color: #444;"></p>
  </div>

  <script>
    // --- 1. DATASET ---
    // Ensure filenames match your GitHub 'images' folder EXACTLY
    const historyData = [
      { 
        name: "Lord Rama", year: "Date Debated", lat: 26.8, lng: 82.2, 
        img: "images/rama.png", 
        desc: "The Seventh Avatar of Vishnu and the King of Ayodhya."
      },
      { 
        name: "Alexander the Great", year: "334 BCE", lat: 37.9, lng: 23.7, 
        img: "images/alexander.png", 
        desc: "Macedonian King who conquered the known world."
      },
      { 
        name: "Adolf Hitler", year: "1939 (WWII)", lat: 52.5, lng: 13.4, 
        img: "images/hitler.png", 
        desc: "Leader of Nazi Germany during World War II."
      }
    ];

    // --- 2. GLOBE INITIALIZATION ---
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      
      .customLayerData(historyData)
      .customLayerElement(d => {
        // Create a 3D Sprite Group
        const g = new THREE.Group();

        // 1. Create the Sprite (The Character)
        const loader = new THREE.TextureLoader();
        const texture = loader.load(d.img, 
            undefined, // onLoad success
            undefined, // onProgress
            (err) => console.error("Could not load image: " + d.img) // onError
        );
        
        const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(material);
        sprite.scale.set(15, 15, 1); // Size of character
        sprite.position.y = 7; // Lift it slightly so feet touch ground
        
        g.add(sprite);
        return g;
      })
      .onCustomLayerClick(d => showDialogue(d));

    // --- 3. UI FUNCTIONS ---
    function showDialogue(data) {
      document.getElementById('box-title').innerText = data.name;
      document.getElementById('box-year').innerText = "ERA: " + data.year;
      document.getElementById('box-desc').innerText = data.desc;
      document.getElementById('box-overlay').style.display = 'block';
      document.getElementById('info-box').style.display = 'block';
      world.controls().autoRotate = false;
    }

    function closeBox() {
      document.getElementById('box-overlay').style.display = 'none';
      document.getElementById('info-box').style.display = 'none';
      world.controls().autoRotate = true;
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
