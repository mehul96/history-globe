<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D | Master Edition</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Shadows+Into+Light&display=swap');
    
    body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; }
    
    /* THE CHARACTER STAND-UP FIGURE */
    .character-standee {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        pointer-events: auto !important;
        transform: translate(-50%, -100%);
        transition: transform 0.2s;
    }
    .character-standee:hover { transform: translate(-50%, -105%) scale(1.4); }
    .character-standee img { width: 60px; height: auto; filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.7)); }
    .character-standee .label {
        background: rgba(0, 0, 0, 0.8); color: #ffcc00; padding: 2px 8px;
        border-radius: 5px; font-size: 11px; font-weight: bold; margin-top: -5px;
        border: 1px solid #ffcc00; white-space: nowrap;
    }

    /* THE DIALOGUE BOX (NOW SCROLLABLE) */
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 700px; max-height: 85vh; 
      overflow-y: auto; background: white; border-radius: 15px;
      display: none; z-index: 10000; padding: 0;
      box-shadow: 0 0 100px rgba(0,0,0,0.9); color: #222;
      border-top: 8px solid #b08d57;
    }
    #info-content { padding: 30px; }

    /* STICKY BACK BUTTON */
    .back-btn-container {
      position: sticky; top: 0; background: white; padding: 15px 30px;
      border-bottom: 1px solid #f0f0f0; z-index: 10001; border-radius: 15px 15px 0 0;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 10px 20px;
      border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem;
    }

    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }
    
    /* Formatting within the description */
    #box-desc b { color: black; display: block; margin-top: 15px; }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  
  <!-- THE DIALOGUE BOX STRUCTURE -->
  <div id="info-box">
    <div class="back-btn-container">
        <button class="back-btn" onclick="closeBox()">✕ BACK TO NAVIGATION</button>
    </div>
    <div id="info-content">
        <div id="box-year" style="color:#b08d57; font-weight:bold; margin-bottom:10px; text-transform: uppercase; letter-spacing: 2px;"></div>
        <h2 id="box-title" style="margin:0; font-size: 2.2rem; font-family: serif;"></h2>
        <hr style="opacity:0.2; margin: 20px 0;">
        <div id="box-desc" style="line-height:1.8; color:#444; font-size:1.1rem;"></div>
    </div>
  </div>

  <script>
    const historyData = [
      { 
        name: "Lord Rama", 
        year: "Date Debated", 
        lat: 26.8, lng: 82.2, 
        img: "./images/rama.png", 
        desc: `
          <b style="font-size:1.4rem; margin-bottom:10px;">Lord Rama and the Ramayana: The Story of Dharma, Duty, and Ideal Leadership</b>
          Unlike figures such as Alexander or Hitler, Lord Rama is primarily a revered religious and literary figure. In Hindu tradition, Rama is worshipped as the seventh avatar of Lord Vishnu.<br><br>
          <b>The Birth of Rama</b>
          The story begins in Ayodhya. After a sacred ritual, King Dasharatha's queens gave birth to four sons: Rama, Bharata, Lakshmana, and Shatrughna. Rama, the eldest, was destined for the throne.<br><br>
          <b>Education and Marriage to Sita</b>
          Rama was trained in warfare and spiritual wisdom. He won the hand of Princess Sita by stringing and breaking the mighty bow of Lord Shiva.<br><br>
          <b>The Exile from Ayodhya</b>
          To uphold his father's promise, Rama accepted a 14-year exile to the forest. Sita and Lakshmana joined him, creating one of history's great examples of sacrifice.<br><br>
          <b>Ravana and the Abduction of Sita</b>
          The demon-king Ravana kidnapped Sita and took her to Lanka. This led to Rama forming an alliance with Hanuman and the Vanara army.<br><br>
          <b>The Great War and Rama Rajya</b>
          Rama defeated Ravana in a massive battle, rescuing Sita. He returned to Ayodhya to establish 'Rama Rajya'—the ideal kingdom of justice, peace, and prosperity.
        `
      },
      { 
        name: "Alexander the Great", 
        year: "334 - 323 BCE", 
        lat: 37.9, lng: 23.7, 
        img: "./images/alexander.png", 
        desc: `
          <b style="font-size:1.4rem; margin-bottom:10px;">Alexander the Great: The Rise and Legacy of a World Conqueror</b>
          By the age of 30, Alexander had built an empire stretching from Greece and Egypt to modern-day India.<br><br>
          <b>Early Life</b>
          Born in Pella, Macedonia, he was tutored by the philosopher Aristotle, who taught him science, medicine, and politics.<br><br>
          <b>Becoming King</b>
          At age 20, after his father Philip II was assassinated, Alexander claimed the throne and crushed all rebellions to secure his power.<br><br>
          <b>Conquering the Persian Empire</b>
          His most famous victory was at Gaugamela, where he defeated King Darius III. He then captured Babylon and Persepolis, causing the Persian Empire to collapse.<br><br>
          <b>Expansion into India</b>
          Alexander crossed into India and fought King Porus. His soldiers eventually refused to go further, forcing a reluctant return toward the west.<br><br>
          <b>Death and Legacy</b>
          He died at age 32 in Babylon. He never lost a battle and his campaigns spread Greek culture across three continents, beginning the Hellenistic Age.
        `
      },
      { 
        name: "Adolf Hitler", 
        year: "1933 - 1945", 
        lat: 52.5, lng: 13.4, 
        img: "./images/hitler.png", 
        desc: `
          <b style="font-size:1.4rem; margin-bottom:10px;">Adolf Hitler: The Rise, Rule, and Fall of Nazi Germany</b>
          Hitler was the leader of Nazi Germany whose expansionist policies triggered World War II and the Holocaust.<br><br>
          <b>Political Awakening</b>
          After serving in WWI, Hitler blamed Germany's economic hardships on political rivals and Jewish people, adopts extremist views.<br><br>
          <b>Rise of the Nazi Party</b>
          Using powerful propaganda, he became Chancellor in 1933. He rapidly dismantled democracy and declared himself 'Führer' of a totalitarian state.<br><br>
          <b>World War II and the Holocaust</b>
          Germany invaded Poland in 1939, starting WWII. Under his regime, the Holocaust systematically murdered approximately six million Jews.<br><br>
          <b>Final Days</b>
          As Allied forces surrounded Berlin in 1945, Hitler died by suicide in a bunker. Germany surrendered shortly afterward, ending the war in Europe.
        `
      }
    ];

    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .htmlElementsData(historyData)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'character-standee';
        el.innerHTML = `
          <img src="${d.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3752/3752311.png'">
          <div class="label">${d.name}</div>
        `;
        el.onclick = () => showDialogue(d);
        return el;
      });

    function showDialogue(data) {
      document.getElementById('box-title').innerText = data.name;
      document.getElementById('box-year').innerText = "Timeline: " + data.year;
      document.getElementById('box-desc').innerHTML = data.desc;
      
      document.getElementById('box-overlay').style.display = 'block';
      const infoBox = document.getElementById('info-box');
      infoBox.style.display = 'block';
      infoBox.scrollTop = 0; // Reset scroll to top
      
      world.controls().autoRotate = false;
    }

    function closeBox() {
      document.getElementById('box-overlay').style.display = 'none';
      document.getElementById('info-box').style.display = 'none';
      world.controls().autoRotate = true;
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
