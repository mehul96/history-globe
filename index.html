<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D | Master Edition</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Shadows+Into+Light&display=swap');
    
    body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; background: #000; }
    
    /* CHARACTER STANDEE */
    .character-standee {
        display: flex; flex-direction: column; align-items: center;
        cursor: pointer; pointer-events: auto !important;
        transform: translate(-50%, -100%); transition: transform 0.2s;
    }
    .character-standee:hover { transform: translate(-50%, -105%) scale(1.4); }
    .character-standee img { width: 60px; height: auto; filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.7)); }
    .character-standee .label {
        background: rgba(0, 0, 0, 0.8); color: #ffcc00; padding: 2px 8px;
        border-radius: 5px; font-size: 11px; font-weight: bold; margin-top: -5px;
        border: 1px solid #ffcc00; white-space: nowrap;
    }

    /* THE DIALOGUE BOX (SCROLLABLE & STICKY) */
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 750px; max-height: 85vh; 
      overflow-y: auto; background: white; border-radius: 15px;
      display: none; z-index: 10000; padding: 0;
      box-shadow: 0 0 100px rgba(0,0,0,0.9); color: #222;
      border-top: 10px solid #b08d57;
    }
    #info-content { padding: 40px; }

    .back-btn-container {
      position: sticky; top: 0; background: white; padding: 15px 30px;
      border-bottom: 1px solid #f0f0f0; z-index: 10001; border-radius: 15px 15px 0 0;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 10px 25px;
      border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem;
    }

    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }

    /* STICKY LIVE BADGE */
    .live-badge {
        position: fixed; top: 20px; right: 20px;
        background-color: #ff4b4b; color: white; padding: 8px 18px;
        border-radius: 30px; font-weight: bold; font-size: 11px;
        z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* TEXT FORMATTING */
    h2 { font-family: 'Lilita One', cursive; font-size: 2.5rem; margin: 0; color: #1a1a1a; line-height: 1.1; }
    .sub-head { color: #b08d57; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    .desc-section { line-height: 1.8; color: #444; font-size: 1.1rem; }
    .desc-section b { color: #000; display: block; margin-top: 25px; font-size: 1.3rem; }
  </style>
</head>
<body>

  <div class="live-badge">🟢 1 Person Navigating Now</div>
  <div id="globeViz"></div>
  <div id="box-overlay" onclick="closeBox()"></div>
  
  <div id="info-box">
    <div class="back-btn-container">
        <button class="back-btn" onclick="closeBox()">✕ BACK TO NAVIGATION</button>
    </div>
    <div id="info-content">
        <div id="box-year" class="sub-head"></div>
        <h2 id="box-title"></h2>
        <hr style="opacity: 0.1; margin: 25px 0;">
        <div id="box-desc" class="desc-section"></div>
    </div>
  </div>

  <script>
    const historyData = [
      { 
        name: "Soviet-Afghan War", 
        year: "1979 - 1989", 
        lat: 33.9, lng: 67.7, 
        img: "./images/afghan.png", 
        desc: `
          <b>Chapter 1: The Soviet Invasion of Afghanistan</b>
          A nine-year conflict fueled by the Cold War. In Dec 1979, the Soviet Union intervened to support the communist PDPA government against rising internal rebellions.
          <br><br>
          <b>1.1 Background and Saur Revolution</b>
          The conflict originated from the Saur Revolution of April 1978. The new communist regime faced resistance as their radical reforms clashed with traditional rural values.
          <br><br>
          <b>1.2 Global Geopolitics</b>
          The US, Saudi Arabia, and Pakistan funneled billions to the 'Mujahedeen' (Islamic guerilla fighters). The introduction of US Stinger missiles in 1986 neutralized Soviet air superiority, turning the tide.
          <br><br>
          <b>1.3 Withdrawal and Collapse</b>
          Mikhail Gorbachev initiated withdrawal in 1988. The war crippled the Soviet economy and contributed significantly to the eventual collapse of the USSR.
        `
      },
      { 
        name: "Fall of Berlin Wall", 
        year: "Nov 9, 1989", 
        lat: 52.5, lng: 13.4, 
        img: "./images/berlin.png", 
        desc: `
          <b>Chapter 2: The Fall of the Berlin Wall</b>
          The most powerful symbol of the Cold War fell on Nov 9, 1989, signaling the end of the Iron Curtain.
          <br><br>
          <b>2.1 The Catalyst of Change</b>
          Mikhail Gorbachev's 'Sinatra Doctrine' signaled that the USSR would no longer use force to prop up hardline communist regimes in Eastern Europe.
          <br><br>
          <b>2.2 The Night of Nov 9</b>
          A bureaucratic mistake by East German official Günter Schabowski led to a premature announcement that travel restrictions were lifted. Thousands rushed the gates, and the guards, overwhelmed and without orders, opened the borders.
        `
      },
      { 
        name: "Vietnam War", 
        year: "1955 - 1975", 
        lat: 14.0, lng: 108.0, 
        img: "./images/vietnam.png", 
        desc: `
          <b>The Vietnam War: A Cold War Flashpoint</b>
          A conflict between North Vietnam (supported by USSR/China) and South Vietnam (supported by the USA).
          <br><br>
          <b>Escalation</b>
          What began as a colonial struggle against France escalated into a massive US military intervention to 'contain' communism. 
          <br><br>
          <b>3.3 The Fall of Saigon</b>
          In April 1975, North Vietnamese tanks crashed through the gates of the Presidential Palace, reunifying the country and marking a significant shift in Asian geopolitics.
        `
      },
      { 
        name: "Bangladesh War", 
        year: "1971", 
        lat: 23.8, lng: 90.4, 
        img: "./images/bangladesh.png", 
        desc: `
          <b>The Bangladesh Liberation War</b>
          A revolution and armed conflict sparked by the rise of Bengali nationalism in East Pakistan.
          <br><br>
          <b>Operation Searchlight</b>
          In March 1971, the Pakistani military launched a crackdown, leading to massive human rights violations and millions of refugees fleeing to India.
          <br><br>
          <b>Indian Intervention</b>
          India joined the war in Dec 1971, leading to the surrender of 93,000 Pakistani soldiers and the creation of the independent nation of Bangladesh.
        `
      },
      { 
        name: "Civil Rights Movement", 
        year: "1954 - 1968", 
        lat: 38.9, lng: -77.0, 
        img: "./images/civilrights.png", 
        desc: `
          <b>The Fight for Equality in the USA</b>
          A decades-long struggle to abolish institutional racial segregation and discrimination.
          <br><br>
          <b>Key Legislation</b>
          The Civil Rights Act of 1964 and the Voting Rights Act of 1965 dismantled 'Jim Crow' laws and enfranchised millions of Black Americans.
          <br><br>
          <b>Leadership</b>
          Led by figures like Dr. Martin Luther King Jr., the movement used non-violent civil disobedience to reshape American society.
        `
      },
      { 
        name: "Cuban Missile Crisis", 
        year: "Oct 1962", 
        lat: 23.1, lng: -82.3, 
        img: "./images/cuba.png", 
        desc: `
          <b>13 Days on the Brink of Nuclear War</b>
          The closest the world ever came to full-scale nuclear conflict.
          <br><br>
          <b>The Stand-off</b>
          The US discovered Soviet nuclear missiles in Cuba. President Kennedy ordered a 'quarantine' around the island. 
          <br><br>
          <b>Resolution</b>
          Khrushchev agreed to remove the missiles in exchange for a US pledge not to invade Cuba and a secret agreement to remove US missiles from Turkey.
        `
      },
      { 
        name: "Moon Landing", 
        year: "July 20, 1969", 
        lat: 28.5, lng: -80.6, 
        img: "./images/moon.png", 
        desc: `
          <b>One Giant Leap for Mankind</b>
          Apollo 11 became the first crewed mission to land on the Moon.
          <br><br>
          <b>The Race to Space</b>
          The mission fulfilled President Kennedy's 1961 goal and marked a supreme technological achievement for humanity.
          <br><br>
          <b>Impact</b>
          Neil Armstrong and Buzz Aldrin spent two hours on the lunar surface, collecting 47 lbs of lunar material.
        `
      },
      { 
        name: "Assassination of Ferdinand", 
        year: "June 28, 1914", 
        lat: 43.8, lng: 18.4, 
        img: "./images/sarajevo.png", 
        desc: `
          <b>The Spark that Ignited World War I</b>
          Archduke Franz Ferdinand of Austria was assassinated in Sarajevo by Gavrilo Princip.
          <br><br>
          <b>The Domino Effect</b>
          This event triggered a series of alliances that brought the global powers into a catastrophic conflict that lasted four years.
        `
      }
    ];

    try {
        const world = Globe()
          (document.getElementById('globeViz'))
          .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
          .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
          .htmlElementsData(historyData)
          .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'character-standee';
            el.innerHTML = `
              <img src="${d.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3752/3752311.png'">
              <div class="label">${d.name}</div>
            `;
            el.onclick = () => showDialogue(d);
            return el;
          });

        function showDialogue(data) {
          document.getElementById('box-title').innerText = data.name;
          document.getElementById('box-year').innerText = "TIMELINE: " + data.year;
          document.getElementById('box-desc').innerHTML = data.desc;
          
          document.getElementById('box-overlay').style.display = 'block';
          const infoBox = document.getElementById('info-box');
          infoBox.style.display = 'block';
          infoBox.scrollTop = 0;
          world.controls().autoRotate = false;
        }

        function closeBox() {
          document.getElementById('box-overlay').style.display = 'none';
          document.getElementById('info-box').style.display = 'none';
          world.controls().autoRotate = true;
        }

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
    } catch (err) {
        document.body.innerHTML = "<h2 style='padding:20px; color:black;'>Globe failed. Reason: " + err.message + "</h2>";
    }
  </script>
</body>
</html>
