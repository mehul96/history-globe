<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Human History 3D Globe</title>
  <!-- Force HTTPS for libraries -->
  <script src="https://unpkg.com/three"></script>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background: #000; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; }
    
    /* THE DIALOGUE BOX */
    #dialogue-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 600px; background: white; border-radius: 15px;
      display: none; z-index: 1000; padding: 30px;
      box-shadow: 0 0 50px rgba(0,0,0,0.8); color: #333;
    }
    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); display: none; z-index: 999;
    }
    .back-btn {
      background: #E31837; color: white; border: none; padding: 10px 20px;
      border-radius: 5px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
    }
    h2 { margin-top: 0; color: #1a1a1a; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }
    p { line-height: 1.6; font-size: 1.1rem; }
    .label { color: #888; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  <div id="dialogue-box">
    <button class="back-btn" onclick="closeBox()">← BACK TO GLOBE</button>
    <div id="content">
        <p class="label" id="box-year"></p>
        <h2 id="box-title"></h2>
        <p id="box-desc"></p>
    </div>
  </div>

  <script>
    const historyData = [
      { name: "Agricultural Revolution", year: "c. 10,000 BCE", lat: 33, lng: 44, color: "#2ecc71", desc: "The transition from hunting and gathering to settled agriculture." },
      { name: "Sumerian Civilization", year: "c. 3500 BCE", lat: 31, lng: 46, color: "#f1c40f", desc: "World's earliest known civilization in Mesopotamia." },
      { name: "Ancient Egyptian Civilization", year: "c. 3100 BCE", lat: 26, lng: 30, color: "#f1c40f", desc: "Civilization along the Nile known for Pharaohs and Pyramids." },
      { name: "Lord Rama (Ramayana)", year: "Date debated", lat: 26.8, lng: 82.2, color: "#e67e22", desc: "The ancient Indian epic followng the life of Lord Rama." },
      { name: "Mahabharata", year: "Date debated", lat: 28.9, lng: 76.9, color: "#e67e22", desc: "Details the Kurukshetra War and the Bhagavad Gita." },
      { name: "Shang Dynasty", year: "c. 1600 BCE", lat: 36, lng: 114, color: "#3498db", desc: "Earliest recorded Chinese dynasty." }
    ];

    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      .pointsData(historyData)
      .pointAltitude(0.1)
      .pointColor('color')
      .pointRadius(1.0)
      .pointLabel(d => `<b>${d.name}</b><br>${d.year}`)
      .onPointClick(d => showDialogue(d));

    function showDialogue(data) {
      document.getElementById('box-title').innerText = data.name;
      document.getElementById('box-year').innerText = data.year;
      document.getElementById('box-desc').innerText = data.desc;
      document.getElementById('box-overlay').style.display = 'block';
      document.getElementById('dialogue-box').style.display = 'block';
      world.controls().autoRotate = false;
    }

    function closeBox() {
      document.getElementById('box-overlay').style.display = 'none';
      document.getElementById('dialogue-box').style.display = 'none';
      world.controls().autoRotate = true;
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;
  </script>
</body>
</html>
