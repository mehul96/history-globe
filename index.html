<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D | Master Edition</title>
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lilita+One&family=Shadows+Into+Light&display=swap');
    
    body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; background: #000; }
    
    /* THE CHARACTER STAND-UP FIGURE */
    .character-standee {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        pointer-events: auto !important;
        transform: translate(-50%, -100%);
        transition: transform 0.2s;
    }
    .character-standee:hover { transform: translate(-50%, -105%) scale(1.4); }
    .character-standee img { width: 60px; height: auto; filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.7)); }
    .character-standee .label {
        background: rgba(0, 0, 0, 0.8); color: #ffcc00; padding: 2px 8px;
        border-radius: 5px; font-size: 11px; font-weight: bold; margin-top: -5px;
        border: 1px solid #ffcc00; white-space: nowrap;
    }

    /* THE DIALOGUE BOX */
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 90%; max-width: 700px; max-height: 85vh; 
      overflow-y: auto; background: white; border-radius: 15px;
      display: none; z-index: 10000; padding: 0;
      box-shadow: 0 0 100px rgba(0,0,0,0.9); color: #222;
      border-top: 8px solid #b08d57;
    }
    #info-content { padding: 30px; }

    .back-btn-container {
      position: sticky; top: 0; background: white; padding: 15px 30px;
      border-bottom: 1px solid #f0f0f0; z-index: 10001; border-radius: 15px 15px 0 0;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 10px 20px;
      border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem;
    }

    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }
    
    #box-desc b { color: black; display: block; margin-top: 15px; }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  
  <div id="info-box">
    <div class="back-btn-container">
        <button class="back-btn" onclick="closeBox()">✕ BACK TO NAVIGATION</button>
    </div>
    <div id="info-content">
        <div id="box-year" style="color:#b08d57; font-weight:bold; margin-bottom:10px; text-transform: uppercase; letter-spacing: 2px;"></div>
        <h2 id="box-title" style="margin:0; font-size: 2.2rem; font-family: serif;"></h2>
        <hr style="opacity:0.2; margin: 20px 0;">
        <div id="box-desc" style="line-height:1.8; color:#444; font-size:1.1rem;"></div>
    </div>
  </div>

  <script>
    // --- VERIFIED DATASET (Check every comma) ---
    const historyData = [
      { 
        name: "Lord Rama", 
        year: "Date Debated", 
        lat: 26.8, lng: 82.2, 
        img: "./images/rama.png", 
        desc: "<b>Lord Rama and the Ramayana</b><br>Revered as the seventh avatar of Vishnu and a symbol of righteousness. His journey from Ayodhya to establish 'Ram Rajya' is a cornerstone of global literature."
      },
      { 
        name: "Alexander the Great", 
        year: "334 - 323 BCE", 
        lat: 37.9, lng: 23.7, 
        img: "./images/alexander.png", 
        desc: "<b>World Conqueror</b><br>Alexander built an empire from Greece to India by age 30, spreading Greek culture (Hellenism) across three continents."
      },
      { 
        name: "Adolf Hitler", 
        year: "1933 - 1945", 
        lat: 52.5, lng: 13.4, 
        img: "./images/hitler.png", 
        desc: "<b>WWII and the Holocaust</b><br>Leader of Nazi Germany whose expansionist policies led to the deadliest conflict in human history and the genocide of six million Jews."
      },
      { 
        name: "Gulf War", 
        year: "1990 - 1991", 
        lat: 29.3, lng: 47.9, 
        img: "./images/gulfwar.png", 
        desc: "<b>Operation Desert Storm</b><br>A US-led coalition liberated Kuwait following Iraq's invasion ordered by Saddam Hussein."
      },
      { 
        name: "Collapse of USSR", 
        year: "1991", 
        lat: 55.7, lng: 37.6, 
        img: "./images/ussr.png", 
        desc: "<b>End of the Cold War</b><br>The dissolution of the Soviet Union marked the end of the bipolar world and the rise of 15 independent nations."
      },
      { 
        name: "9/11 Attacks", 
        year: "2001", 
        lat: 40.7, lng: -74.0, 
        img: "./images/sept11.png", 
        desc: "<b>The Day that Changed Everything</b><br>Terrorist attacks in NYC and Washington D.C. that triggered the global War on Terror."
      },
      { 
        name: "Arab Spring", 
        year: "2010 - 2012", 
        lat: 33.8, lng: 9.5, 
        img: "./images/arabspring.png", 
        desc: "<b>Middle East Revolutions</b><br>Pro-democracy uprisings that swept across Tunisia, Egypt, Libya, and Syria."
      },
      { 
        name: "Invasion of Ukraine", 
        year: "2022 - Present", 
        lat: 50.4, lng: 30.5, 
        img: "./images/ukraine.png", 
        desc: "<b>Modern Conflict in Europe</b><br>Russia's full-scale military invasion of Ukraine, escalating a conflict that began in 2014."
      }
    ];

    try {
        const world = Globe()
          (document.getElementById('globeViz'))
          .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
          .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
          .htmlElementsData(historyData)
          .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'character-standee';
            el.innerHTML = `
              <img src="${d.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3752/3752311.png'">
              <div class="label">${d.name}</div>
            `;
            el.onclick = () => showDialogue(d);
            return el;
          });

        function showDialogue(data) {
          document.getElementById('box-title').innerText = data.name;
          document.getElementById('box-year').innerText = "Timeline: " + data.year;
          document.getElementById('box-desc').innerHTML = data.desc;
          
          document.getElementById('box-overlay').style.display = 'block';
          const infoBox = document.getElementById('info-box');
          infoBox.style.display = 'block';
          infoBox.scrollTop = 0;
          world.controls().autoRotate = false;
        }

        function closeBox() {
          document.getElementById('box-overlay').style.display = 'none';
          document.getElementById('info-box').style.display = 'none';
          world.controls().autoRotate = true;
        }

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
    } catch (err) {
        document.body.innerHTML = "<h2 style='padding:20px'>Globe failed to load. Reason: " + err.message + "</h2>";
    }
  </script>
</body>
</html>
