<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HistoryGlobe 3D</title>
  <!-- Using the standard browser-ready library -->
  <script src="https://unpkg.com/globe.gl"></script>
  <style>
    body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; color: white; }
    #globeViz { width: 100vw; height: 100vh; }
    
    /* THE CHARACTER STAND-UP FIGURE */
    .character-standee {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;
        pointer-events: auto !important;
        /* Move the anchor to the feet of the image */
        transform: translate(-50%, -100%);
        transition: transform 0.2s;
    }
    
    .character-standee:hover {
        transform: translate(-50%, -105%) scale(1.4);
    }

    .character-standee img {
        width: 60px; /* Adjust size here */
        height: auto;
        filter: drop-shadow(0 0 10px rgba(255, 204, 0, 0.7));
    }

    .character-standee .label {
        background: rgba(0, 0, 0, 0.8);
        color: #ffcc00;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: bold;
        margin-top: -5px;
        border: 1px solid #ffcc00;
        white-space: nowrap;
    }

    /* THE POPUP DIALOGUE BOX */
    #info-box {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 85%; max-width: 550px; background: white; border-radius: 20px;
      display: none; z-index: 10000; padding: 35px;
      box-shadow: 0 0 100px rgba(0,0,0,0.9); color: #222;
      border-top: 8px solid #b08d57;
    }
    #box-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: none; z-index: 9999;
    }
    .back-btn {
      background: #b08d57; color: white; border: none; padding: 12px 24px;
      border-radius: 50px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div id="globeViz"></div>

  <div id="box-overlay" onclick="closeBox()"></div>
  <div id="info-box">
    <button class="back-btn" onclick="closeBox()">✕ BACK TO NAVIGATION</button>
    <div id="box-year" style="color:#b08d57; font-weight:bold; margin-bottom:10px;"></div>
    <h2 id="box-title" style="margin:0; font-size: 2rem;"></h2>
    <hr style="opacity:0.2; margin:20px 0;">
    <p id="box-desc" style="line-height:1.8; color:#444; font-size:1.1rem;"></p>
  </div>

  <script>
    // --- 1. DATASET ---
    // The path './images/...' works best for GitHub Pages
    const historyData = [
      { 
        name: "Lord Rama", year: "Between 800 BCE and 400 BCE", lat: 26.8, lng: 82.2, 
        img: "./images/rama.png", 
        desc: "Lord Rama and the Ramayana: The Story of Dharma, Duty, and Ideal Leadership

Unlike figures such as Alexander or Hitler, Lord Rama is primarily a revered religious and literary figure rather than a historical ruler documented through modern historical records. In Hindu tradition, Rama is worshipped as the seventh avatar (incarnation) of Lord Vishnu and is the central hero of the Ramayana, one of India's greatest epics.

The Birth of Rama

The story begins in the kingdom of Ayodhya, ruled by King Dasharatha. Although prosperous and respected, Dasharatha had no children and worried about the future of his kingdom. After performing a sacred ritual, his queens gave birth to four sons:

Rama
Bharata
Lakshmana
Shatrughna

Rama, the eldest son, was born to Queen Kaushalya and was destined to become the heir to the throne. From childhood, he displayed wisdom, compassion, courage, humility, and devotion to duty.

Education and Marriage to Sita

As a young prince, Rama was trained in warfare, governance, and spiritual wisdom under great sages. During a journey with the sage Vishvamitra, Rama protected sacred hermitages from evil forces and demonstrated extraordinary strength and virtue.

In the kingdom of Mithila lived Princess Sita, renowned for her beauty, purity, and character. Her father, King Janaka, declared that she would marry the man who could string the mighty bow of Lord Shiva.

Many kings failed.

Rama not only lifted the bow but broke it while stringing it. Sita chose him as her husband, and their marriage became an enduring symbol of devotion and righteousness.

The Exile from Ayodhya

As King Dasharatha prepared to crown Rama as king, a dramatic turn changed everything.

Dasharatha's wife Kaikeyi invoked two promises the king had previously made to her. She demanded:

Her son Bharata be made king.
Rama be exiled to the forest for fourteen years.

Though unjust, Rama accepted the decision without anger because he believed obeying his father's word was his sacred duty (dharma). Sita insisted on accompanying him, and his devoted brother Lakshmana joined them as well.

This episode remains one of the most famous examples of sacrifice and duty in world literature.

Life in the Forest

For years, Rama, Sita, and Lakshmana lived in forests across India, meeting sages, helping communities, and confronting dangerous beings.

During this period, they encountered Shurpanakha, sister of the powerful king Ravana. Humiliated after her advances toward Rama were rejected, she sought revenge and persuaded Ravana to abduct Sita.

Ravana and the Abduction of Sita

Ravana, the powerful ruler of Lanka, was a learned and mighty king but was consumed by pride and desire.

Using deception, he lured Rama and Lakshmana away from their hut and kidnapped Sita, carrying her to Lanka in his flying chariot.

Sita refused Ravana's attempts to make her his queen and remained steadfastly devoted to Rama despite months of captivity.

Hanuman and the Search for Sita

While searching for Sita, Rama formed an alliance with Sugriva, king of the Vanaras (often described as a monkey kingdom).

Among Sugriva's followers was Hanuman, one of the most beloved figures in Hindu tradition. Hanuman became completely devoted to Rama and dedicated himself to finding Sita.

Hanuman made an extraordinary leap across the ocean to Lanka, located Sita, delivered Rama's message, and returned with information that would enable the rescue mission.

Building the Bridge to Lanka

To reach Lanka, Rama's army constructed a legendary bridge across the sea, often referred to as Rama Setu in Hindu tradition.

The crossing set the stage for one of the epic's greatest events: the war between Rama and Ravana.

The Great War

A massive battle followed between the forces of Rama and Ravana.

Many heroes fought on both sides. Hanuman's courage, Lakshmana's loyalty, and the determination of Rama's allies proved decisive.

After fierce combat, Rama confronted Ravana directly and defeated him, ending his reign and rescuing Sita. The victory symbolized the triumph of righteousness over evil.

This victory is celebrated annually during Dussehra.

Return to Ayodhya

After completing the fourteen-year exile, Rama, Sita, and Lakshmana returned to Ayodhya.

The people welcomed them with lamps and celebrations, marking Rama's return and coronation as king. This event is commemorated in the festival of Diwali, one of the most widely celebrated festivals in India.

Rama Rajya: The Ideal Kingdom

Rama's reign became known as Rama Rajya, representing an ideal society characterized by:

Justice
Prosperity
Peace
Ethical governance
Respect for duty and law

For centuries, Rama Rajya has remained a symbol of ideal leadership and good governance in Indian thought.

Sita's Final Departure

The later chapters of the Ramayana describe public doubts about Sita's purity after her captivity in Lanka. To preserve public confidence in the kingdom, Rama reluctantly separated from Sita.

Living in a hermitage, Sita gave birth to twin sons, Lava and Kusha. Eventually, she called upon Mother Earth, from whom she was believed to have originated, and returned to the earth.

Legacy of Rama

Rama is revered as:

The ideal son
The ideal husband
The ideal brother
The ideal king
The embodiment of dharma (righteous duty)

The Ramayana, traditionally attributed to the sage Valmiki, contains approximately 24,000 verses and remains one of the most influential works of literature and spirituality in Asia. It has inspired countless retellings, performances, artworks, and religious traditions across India and Southeast Asia.

In Summary

The Ramayana is not merely a story of a prince rescuing his wife. It is a profound exploration of duty, sacrifice, loyalty, courage, leadership, and morality. Lord Rama's journey from prince to exile, warrior, and king continues to serve as a model of righteous conduct for millions of people around the world."
      },
      { 
        name: "Alexander The Great", year: "334 BCE", lat: 37.9, lng: 23.7, 
        img: "./images/alexander.png", 
        desc: "Alexander the Great: The Rise, Conquests, and Legacy of a World Conqueror

Alexander the Great (356 BCE to 323 BCE) was one of history's most famous military commanders and rulers. By the age of 30, he had built an empire stretching from Greece and Egypt to parts of modern-day India, creating one of the largest empires of the ancient world.

Early Life and Education (356 BCE to 336 BCE)

Alexander was born in 356 BCE in Pella, the capital of Macedonia. He was the son of King Philip II of Macedonia and Queen Olympias. From an early age, he showed intelligence, ambition, and courage.

When he was about 13 years old, his father appointed the Greek philosopher Aristotle as his tutor. Aristotle taught him philosophy, science, medicine, literature, and politics. This education helped shape Alexander into both a warrior and a statesman.

As a teenager, Alexander also gained military experience. At age 16, he governed Macedonia while his father was away on campaign, and at 18 he played an important role in the Macedonian victory at the Battle of Chaeronea.

Becoming King (336 BCE)

In 336 BCE, King Philip II was assassinated. At only 20 years old, Alexander became king of Macedonia. Many rivals hoped to challenge his rule, but Alexander acted quickly to eliminate threats and secure his position.

Several Greek city-states rebelled, believing the young king would be weak. Alexander crushed these uprisings and demonstrated that he possessed the same military strength as his father. The destruction of Thebes served as a warning to other potential rebels.

The Persian Campaign Begins (334 BCE)

Alexander's greatest ambition was to invade the Persian Empire, the most powerful empire of the time. In 334 BCE, he crossed into Asia Minor with an army of Macedonian and Greek soldiers.

His first major victory came at the Battle of the Granicus River. This success opened much of Asia Minor to his forces and marked the beginning of a campaign that would change world history.

Defeating Darius III (333 BCE)

In 333 BCE, Alexander faced the Persian king Darius III at the Battle of Issus. Although Darius commanded a much larger army, Alexander's leadership and battlefield tactics secured a decisive victory. Darius fled, leaving his family behind.

This victory established Alexander as the dominant military force in the region and severely weakened Persian authority.

The Siege of Tyre and Conquest of Egypt (332 BCE)

Alexander then marched south along the Mediterranean coast. One of his most famous military achievements was the Siege of Tyre, a heavily fortified island city. After months of effort, he captured it, demonstrating his persistence and engineering skill.

He continued into Egypt, where he was welcomed as a liberator from Persian rule. In Egypt, he founded the city of Alexandria, which later became one of the most important centers of learning and culture in the ancient world.

Conquering the Persian Empire (331 BCE to 330 BCE)

Alexander's most important victory came at the Battle of Gaugamela in 331 BCE. Once again, Darius III commanded a larger force, but Alexander's superior tactics won the day.

After this victory, he captured major Persian cities including Babylon, Susa, and Persepolis. The Persian Empire effectively collapsed, and Alexander declared himself King of Asia.

Eventually, Darius III was killed by his own followers while fleeing. Alexander became ruler of the vast Persian territories and inherited the wealth and resources of the former empire.

Expansion into Central Asia and India (330 BCE to 326 BCE)

Most rulers would have stopped after conquering Persia, but Alexander continued eastward. He campaigned through modern Afghanistan and Central Asia, suppressing rebellions and establishing new cities.

In 326 BCE, he crossed into northwestern India and fought King Porus at the Battle of the Hydaspes River. Although victorious, Alexander was impressed by Porus and allowed him to continue ruling under Macedonian authority.

After years of campaigning, Alexander's exhausted soldiers refused to march farther east. Reluctantly, he agreed to turn back.

Building a New World

Alexander was more than a conqueror. He encouraged interaction between Greek and local cultures throughout his empire. He adopted some Persian customs, included Persians in his administration, and promoted cultural integration.

His campaigns spread Greek language, art, philosophy, and science across a huge area. This blending of cultures became known as the Hellenistic Age, which strongly influenced the development of the Mediterranean, Middle East, and parts of Asia for centuries.

Death in Babylon (323 BCE)

In 323 BCE, Alexander returned to Babylon and began planning further expeditions. However, he suddenly fell ill and died at the age of 32. The exact cause of his death remains uncertain, with historians suggesting possibilities such as disease, infection, or other natural causes.

Because he left no clear adult heir, his generals fought over control of the empire after his death. Eventually, the empire fragmented into several kingdoms.

Historical Legacy

Alexander never lost a major battle and is widely regarded as one of the greatest military commanders in history. His conquests altered the political and cultural landscape of three continents.

Unlike many conquerors remembered only for warfare, Alexander's lasting impact came from the widespread exchange of ideas, trade, technology, and culture that followed his campaigns. The Hellenistic world he helped create influenced the Roman Empire and much of later Western and Middle Eastern civilization.

In Summary

Alexander's story is one of extraordinary ambition. Born a prince in a small kingdom, he became king at 20, conquered the largest empire of his age before 30, and left a legacy that shaped history long after his death. Though his empire did not survive intact, his influence continued for centuries across Europe, Africa, and Asia."
      },
      { 
        name: "Adolf Hitler", year: "1939 (WWII)", lat: 52.5, lng: 13.4, 
        img: "./images/hitler.png", 
        desc: Here is a detailed narrative-style overview of Adolf Hitler's life and historical role.

Adolf Hitler: The Rise, Rule, and Fall of Nazi Germany

Adolf Hitler (1889–1945) was the leader of Nazi Germany and one of the most consequential and destructive figures in modern history. His leadership led to World War II and the Holocaust, resulting in the deaths of tens of millions of people.

Early Life (1889–1913)

Hitler was born on April 20, 1889, in Braunau am Inn, Austria-Hungary. As a young man, he aspired to become an artist and twice applied to the Vienna Academy of Fine Arts but was rejected. During his years in Vienna, he experienced poverty and developed many of the political and racial ideas that later shaped his ideology.

In 1913, he moved to Munich, Germany, seeking new opportunities.

World War I and Political Awakening (1914–1919)

When World War I began in 1914, Hitler volunteered for service in the German Army. He served as a messenger on the Western Front, was wounded, and later temporarily blinded in a mustard gas attack. Germany's defeat in 1918 deeply affected him.

After the war, Germany faced economic hardship, political instability, and resentment over the Treaty of Versailles. Hitler blamed Germany's problems on political opponents, communists, and especially Jewish people, adopting increasingly extremist views.

Rise of the Nazi Party (1919–1933)

In 1919, Hitler joined the German Workers' Party, which later became the National Socialist German Workers' Party (Nazi Party). His powerful public speaking and propaganda skills quickly made him the party's leader.

In 1923, Hitler attempted to seize power in Munich through the Beer Hall Putsch, a failed coup. He was arrested and imprisoned. During his imprisonment, he dictated Mein Kampf ("My Struggle"), outlining his nationalist, racist, antisemitic, and expansionist beliefs.

Following his release, Hitler pursued power through elections rather than revolution. The Great Depression of 1929 created widespread unemployment and despair, allowing the Nazi Party to gain support by promising national revival and strong leadership.

In January 1933, German President Paul von Hindenburg appointed Hitler Chancellor of Germany. Contrary to a common misconception, Hitler was not directly elected dictator; he was appointed and then consolidated power through political maneuvers and emergency legislation.

Establishing Dictatorship (1933–1939)

After becoming Chancellor, Hitler rapidly dismantled Germany's democratic institutions. Following the Reichstag Fire in February 1933, emergency measures restricted civil liberties. The Enabling Act soon granted Hitler broad powers, allowing him to govern without parliamentary approval.

By 1934, after Hindenburg's death, Hitler merged the offices of President and Chancellor and assumed the title Führer ("Leader"), establishing a totalitarian dictatorship.

The Nazi regime controlled the media, suppressed opposition, imprisoned critics, and implemented racial laws targeting Jews and other groups. Propaganda became a major tool for shaping public opinion and strengthening Hitler's cult of personality.

Road to War (1938–1939)

Hitler sought to expand German territory and overturn the post-World War I settlement. Germany annexed Austria in 1938 and later acquired the Sudetenland region of Czechoslovakia through the Munich Agreement.

On September 1, 1939, Germany invaded Poland. Britain and France declared war on Germany shortly afterward, marking the beginning of World War II.

World War II and the Holocaust (1939–1945)

During the early years of the war, Germany conquered much of Europe. However, Hitler made critical strategic decisions, including the 1941 invasion of the Soviet Union, which opened a massive eastern front.

Under Hitler's regime, the Holocaust was carried out. The Nazi government systematically persecuted and murdered approximately six million Jews, along with millions of others including Roma, disabled people, political opponents, Soviet prisoners of war, and other targeted groups. The Holocaust remains one of history's greatest atrocities.

As the war progressed, Germany suffered major defeats, notably at Stalingrad and after the Allied landings in Western Europe. By 1945, Nazi Germany was collapsing under advancing Allied forces.

Final Days and Death (1945)

In April 1945, Soviet forces surrounded Berlin. Hitler remained in a bunker beneath the city. On April 29, he married Eva Braun. The following day, April 30, 1945, both died by suicide as Germany faced certain defeat.

Germany surrendered shortly afterward, ending the war in Europe.

Historical Legacy

Hitler's legacy is overwhelmingly associated with dictatorship, aggressive warfare, genocide, and the destruction caused by World War II. Historians generally regard him as the principal architect of the war in Europe and the leader responsible for the Holocaust. His actions reshaped global politics and left lasting lessons about extremism, authoritarianism, propaganda, and intolerance.

In summary, Hitler's story is not one of achievement but a historical warning of how extremist ideology, political instability, and concentrated power can lead to catastrophic human consequences."
      }
    ];

    // --- 2. INITIALIZE GLOBE ---
    const world = Globe()
      (document.getElementById('globeViz'))
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
      .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
      
      // USE HTML ELEMENTS (MUCH MORE STABLE)
      .htmlElementsData(historyData)
      .htmlElement(d => {
        const el = document.createElement('div');
        el.className = 'character-standee';
        el.innerHTML = `
          <img src="${d.img}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3752/3752311.png'">
          <div class="label">${d.name}</div>
        `;
        
        // Clicks will now work 100%
        el.onclick = () => showDialogue(d);
        return el;
      });

    // --- 3. UI FUNCTIONS ---
    function showDialogue(data) {
      document.getElementById('box-title').innerText = data.name;
      document.getElementById('box-year').innerText = "ERA: " + data.year;
      document.getElementById('box-desc').innerText = data.desc;
      document.getElementById('box-overlay').style.display = 'block';
      document.getElementById('info-box').style.display = 'block';
      world.controls().autoRotate = false;
    }

    function closeBox() {
      document.getElementById('box-overlay').style.display = 'none';
      document.getElementById('info-box').style.display = 'none';
      world.controls().autoRotate = true;
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
  </script>
</body>
</html>
